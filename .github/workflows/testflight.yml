name: Call Mom - Signed TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_BUNDLE_ID: studio.mikegyver.callmom

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets and write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          for VAR in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID ASC_KEY_P8; do
            if [ -z "${!VAR}" ]; then echo "::error::Missing secret $VAR"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey.p8"
          grep -q 'END PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey.p8"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc' / 'AuthKey.p8'
          data = {'key_id': os.environ['ASC_KEY_ID'], 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': p.read_text(), 'in_house': False}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc_key.json').write_text(json.dumps(data))
          PY

      - name: Install build tools
        run: |
          xcodebuild -version
          sudo gem install fastlane -N
          brew install xcodegen

      - name: Create isolated signing keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/callmom.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN"

      - name: Acquire distribution certificate and app profile
        run: |
          mkdir -p "$RUNNER_TEMP/certs" "$RUNNER_TEMP/profiles"
          fastlane cert --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --output_path "$RUNNER_TEMP/certs" \
            --keychain_path "$SIGNING_KEYCHAIN" \
            --keychain_password "$SIGNING_KEYCHAIN_PASSWORD"
          fastlane sigh --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_identifier "$APP_BUNDLE_ID" --output_path "$RUNNER_TEMP/profiles" --force
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'profiles'
          found = None
          teams = set()
          for path in base.glob('*.mobileprovision'):
              raw = subprocess.check_output(['security','cms','-D','-i',str(path)])
              profile = plistlib.loads(raw)
              ent_id = profile.get('Entitlements',{}).get('application-identifier','')
              if ent_id.endswith('.' + os.environ['APP_BUNDLE_ID']):
                  found = profile['UUID']
                  teams.add(profile['TeamIdentifier'][0])
          if not found:
              raise SystemExit('Missing provisioning profile for studio.mikegyver.callmom')
          if len(teams) != 1:
              raise SystemExit('Provisioning profiles do not agree on Apple Team ID')
          team = teams.pop()
          if team != os.environ['TEAM_ID']:
              raise SystemExit('TEAM_ID secret differs from the team in Apple provisioning profile')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'APP_PROFILE_UUID={found}\n')
          print('Found app provisioning profile for the expected team.')
          PY

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"
          grep -q 'Apple Distribution' "$RUNNER_TEMP/identities.txt"

      - name: Generate project
        run: |
          xcodegen generate --spec project.yml
          grep -q "$APP_PROFILE_UUID" CallMom.xcodeproj/project.pbxproj

      - name: Archive signed app
        run: |
          xcodebuild -project CallMom.xcodeproj -scheme CallMom \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CallMom.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" archive

      - name: Write App Store Connect export options
        run: |
          python3 - <<'PY'
          import os, plistlib
          opts = {'method':'app-store-connect', 'teamID':os.environ['TEAM_ID'],
                  'signingStyle':'manual', 'provisioningProfiles':{
                    os.environ['APP_BUNDLE_ID']:os.environ['APP_PROFILE_UUID']},
                  'uploadSymbols':True}
          with open(os.path.join(os.environ['RUNNER_TEMP'],'ExportOptions.plist'),'wb') as f:
              plistlib.dump(opts,f)
          PY

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CallMom.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          fastlane pilot upload --ipa "$IPA" \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --skip_submission --skip_waiting_for_build_processing
